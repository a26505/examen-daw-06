name: CI/CD - Automático a AWS

on:
  push:
    branches: [ "main", "master" ]

jobs:
  construir-y-desplegar:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Descargar el código
      uses: actions/checkout@v3

    - name: 2. Iniciar sesión en DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 3. Construir y subir BACKEND
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/backend-examen:latest ./backend
        docker push ${{ secrets.DOCKER_USERNAME }}/backend-examen:latest

    - name: 4. Construir y subir FRONTEND
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend-examen:latest ./frontend
        docker push ${{ secrets.DOCKER_USERNAME }}/frontend-examen:latest

    # --- AQUÍ EMPIEZA LA MAGIA DEL REINICIO AUTOMÁTICO ---

    - name: 5. Configurar credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1

    - name: 6. Conectar con el Clúster
      run: aws eks update-kubeconfig --name Demo-Cluster --region us-east-1

    - name: 7. Reiniciar Kubernetes solo
      run: |
        kubectl rollout restart deployment frontend-deploy
        kubectl rollout restart deployment backend-deploy