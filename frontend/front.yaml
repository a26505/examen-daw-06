apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-temp
  template:
    metadata:
      labels:
        app: frontend-temp
    spec:
      containers:
      - name: frontend
        image: danic19/frontend-examen:latest
        ports:
        - containerPort: 3000
        env:
        - name: TEMP_SERVER
          value: "temperaturas-backend:5000"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: LoadBalancer
  selector:
    app: frontend-temp
  ports:
    - port: 80
      targetPort: 3000